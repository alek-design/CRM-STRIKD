# Al subir cambios a main, los copia al instante al repo que usa Vercel (Alexalfaro009/CRM-STRIKD).
# Necesita el secreto MIRROR_TOKEN (token de GitHub de Alex con permiso de escribir en su repo).
name: Publicar en el repo de Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publicar:
    if: github.repository == 'alek-design/CRM-STRIKD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Copiar a Alexalfaro009/CRM-STRIKD
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Falta el secreto MIRROR_TOKEN; no se copia."; exit 0; fi
          set +e
          OUT=$(git push --force "https://x-access-token:${TOKEN}@github.com/Alexalfaro009/CRM-STRIKD.git" HEAD:refs/heads/main 2>&1); RC=$?
          OUT=$(printf "%s" "$OUT" | sed "s/${TOKEN}/***/g" | tr '\n' ' ')
          if [ $RC -ne 0 ]; then echo "::error::No se pudo copiar al repo de Vercel: $OUT"; exit 1; fi
          echo "::notice::Copiado a Alexalfaro009/CRM-STRIKD"
